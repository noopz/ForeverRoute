# A tag like v0.4.0 builds the zip (tools/package.sh), attaches it to a GitHub release, and uploads it to CurseForge
# when the repo has the secret CF_API_KEY and the variables CF_PROJECT_ID and CF_GAME_VERSIONS (comma-separated
# CurseForge game version ids for WoW Forever). The release notes on both are this version's section of CHANGELOG.md.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: bash tools/package.sh "${GITHUB_REF_NAME#v}"
      # a tag without a CHANGELOG.md section fails here, before anything is published
      - name: Release notes
        run: node tools/release-notes.js "$GITHUB_REF_NAME" > dist/notes.md && cat dist/notes.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Forever Route $GITHUB_REF_NAME" --notes-file dist/notes.md
      - name: CurseForge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
          CF_GAME_VERSIONS: ${{ vars.CF_GAME_VERSIONS }}
        run: |
          if [ -z "$CF_API_KEY" ] || [ -z "$CF_PROJECT_ID" ] || [ -z "$CF_GAME_VERSIONS" ]; then echo "CurseForge not set up yet: skipped"; exit 0; fi
          f=$(ls dist/*.zip)
          node tools/release-notes.js "$GITHUB_REF_NAME" --curseforge "$CF_GAME_VERSIONS" > dist/meta.json
          curl -sSf -H "X-Api-Token: $CF_API_KEY" -F "metadata=<dist/meta.json" -F "file=@$f" "https://wow.curseforge.com/api/projects/$CF_PROJECT_ID/upload-file"
