<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#0b1020}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
// The planner thinking: at each leg it weighs every zone you could go to next (xp per hour, hand-ins, time) and picks
// one. Real choices from a built-in plan, spread from 1 to 60. Data: tools/readme-hero.js think.
const C = document.getElementById('c'), g = C.getContext('2d');
const FONT = '"Segoe UI", system-ui, sans-serif';
const GOLD = '#ffd15c', INK = '#eef0f6', SUB = '#9ea8bd', DIM = '#5d6578', SKY = '#62cdfc';
let D, bg, S, OX, OY, F, MAX;
const PER = 26, MAPW = 520;
const load = (src) => new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });
const zoneOf = (name) => D.zones.find((z) => z.name === name);

window.init = async (data) => {
  D = data; C.width = D.W; C.height = D.H;
  S = Math.min((MAPW - 16) / D.map.W, (D.H - 40) / D.map.H); OX = 8; OY = (D.H - D.map.H * S) / 2 + 10;
  const ims = await Promise.all(D.zones.map((z) => load(z.png)));
  const probe = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
  const sea = [0, 0, 0]; let ns = 0;
  for (const im of ims) if (im) { probe.canvas.width = im.width; probe.canvas.height = im.height; probe.drawImage(im, 0, 0); const d = probe.getImageData(1, 1, 1, 1).data; if (d[2] > d[0] + 20) { sea[0] += d[0]; sea[1] += d[1]; sea[2] += d[2]; ns++; } }
  const seaRGB = ns ? sea.map((v) => Math.round(v / ns)) : [26, 37, 80];
  const raw = document.createElement('canvas'); raw.width = D.W; raw.height = D.H;
  const r = raw.getContext('2d', { willReadFrequently: true });
  r.fillStyle = `rgb(${seaRGB.join(',')})`; r.fillRect(0, 0, MAPW, D.H);
  D.zones.forEach((z, k) => { if (ims[k]) r.drawImage(ims[k], OX + z.x * S, OY + z.y * S, z.w * S, z.h * S); });
  const px = r.getImageData(0, 0, MAPW, D.H), a = px.data;
  for (let i = 0; i < a.length; i += 4) if (a[i] + a[i + 1] + a[i + 2] < 100 && a[i + 2] < a[i] + 25) { a[i] = seaRGB[0]; a[i + 1] = seaRGB[1]; a[i + 2] = seaRGB[2]; }
  r.putImageData(px, 0, 0);
  bg = document.createElement('canvas'); bg.width = D.W; bg.height = D.H; const b = bg.getContext('2d');
  b.fillStyle = '#0b1020'; b.fillRect(0, 0, D.W, D.H);
  b.filter = 'saturate(0.45) brightness(0.5)'; b.drawImage(raw, 0, 0); b.filter = 'none';
  MAX = Math.max(...D.picks.flatMap((p) => p.opts.map((o) => o.xph)));
  F = D.picks.length * PER;
  return F + 1;
};
const center = (z) => [OX + (z.x + z.w / 2) * S, OY + (z.y + z.h / 2) * S];
const ease = (t) => 1 - Math.pow(1 - Math.max(0, Math.min(1, t)), 3);

window.draw = (f) => {
  const end = f >= F, k = Math.min(D.picks.length - 1, Math.floor(f / PER)), t = end ? PER : f - k * PER, p = D.picks[k];
  g.drawImage(bg, 0, 0);
  // the path so far: chosen zone to chosen zone
  const chosen = D.picks.slice(0, k + (t >= 14 ? 1 : 0)).map((q) => zoneOf(q.chosenName)).filter(Boolean);
  g.strokeStyle = 'rgba(255,209,92,0.55)'; g.lineWidth = 2; g.setLineDash([4, 5]); g.beginPath();
  chosen.forEach((z, i) => { const [x, y] = center(z); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke(); g.setLineDash([]);
  chosen.forEach((z, i) => { const [x, y] = center(z); g.fillStyle = i === chosen.length - 1 ? GOLD : 'rgba(255,209,92,0.6)'; g.beginPath(); g.arc(x, y, i === chosen.length - 1 ? 5 : 3, 0, 7); g.fill(); });
  // the zones being weighed
  if (!end) p.opts.forEach((o, i) => {
    const z = zoneOf(o.name); if (!z) return;
    const x = OX + z.x * S, y = OY + z.y * S, w = z.w * S, h = z.h * S;
    const win = o.chosen && t >= 14;
    const a = win ? 1 : t >= 14 ? 0.25 : ease(t / 4);
    g.strokeStyle = win ? GOLD : `rgba(98,205,252,${a})`; g.lineWidth = win ? 2.5 : 1.5;
    if (win) { g.fillStyle = 'rgba(255,209,92,0.16)'; g.fillRect(x, y, w, h); g.shadowColor = GOLD; g.shadowBlur = 14; }
    g.strokeRect(x, y, w, h); g.shadowBlur = 0;
  });
  // the panel
  const X = MAPW + 30, W = D.W - X - 34;
  g.fillStyle = '#0b1020'; g.fillRect(MAPW + 4, 0, D.W, D.H);
  const grd = g.createLinearGradient(MAPW - 20, 0, MAPW + 6, 0); grd.addColorStop(0, 'rgba(11,16,32,0)'); grd.addColorStop(1, 'rgba(11,16,32,1)'); g.fillStyle = grd; g.fillRect(MAPW - 20, 0, 26, D.H);
  g.fillStyle = '#2a2350'; rr(X, 26, 112, 24, 12); g.fill(); g.fillStyle = '#c9b8ff'; g.font = '700 12px ' + FONT; g.fillText('FOREVERROUTE', X + 13, 42.5);
  g.fillStyle = INK; g.font = '600 21px ' + FONT; g.fillText('Where next? The planner weighs every zone', X, 84);
  g.fillStyle = SUB; g.font = '14px ' + FONT; g.fillText('Real choices from the ' + D.title + ' plan: ' + D.legs + ' of them, 1 to 60', X, 106);
  if (end) {
    g.fillStyle = GOLD; g.font = '700 40px ' + FONT; g.fillText(D.legs + ' choices', X, 220);
    g.fillStyle = INK; g.font = '16px ' + FONT; g.fillText('each one: every zone in reach, planned out', X, 252); g.fillText('in full, scored on xp per hour', X, 274);
    return 400;
  }
  g.fillStyle = DIM; g.font = '700 12px ' + FONT; g.fillText('LEG ' + p.leg + '  ·  YOU ARE LEVEL ' + p.level, X, 150);
  const rowH = 52;
  p.opts.forEach((o, i) => {
    const y = 172 + i * rowH, grow = ease((t - 3 - i * 0.8) / 9), win = o.chosen && t >= 14, lose = !o.chosen && t >= 14;
    g.globalAlpha = lose ? 0.35 : 1;
    g.fillStyle = win ? GOLD : INK; g.font = (win ? '700 ' : '600 ') + '15px ' + FONT; g.fillText(o.name, X, y);
    g.fillStyle = 'rgba(255,255,255,0.06)'; rr(X, y + 8, W, 12, 6); g.fill();
    g.fillStyle = win ? GOLD : SKY; if (grow > 0) { rr(X, y + 8, Math.max(12, W * (o.xph / MAX) * grow), 12, 6); g.fill(); }
    g.textAlign = 'right'; g.fillStyle = win ? GOLD : SUB; g.font = '13px ' + FONT;
    g.fillText(grow > 0.05 ? Math.round(o.xph * grow / 100) / 10 + 'k xp/h  ·  ' + o.turnins + ' quests  ·  ' + Math.round(o.minutes) + ' min' : '', X + W, y);
    g.textAlign = 'left'; g.globalAlpha = 1;
  });
  if (t >= 14) { const a = ease((t - 14) / 4); g.globalAlpha = a; g.fillStyle = GOLD; g.font = '700 22px ' + FONT; const c = p.opts.find((o) => o.chosen) || p.opts[0]; g.fillText('→ ' + p.chosenName + (p.to > p.level ? ':  level ' + p.level + ' to ' + p.to : ':  ' + c.minutes + ' min of quests'), X, 172 + p.opts.length * rowH + 22); g.globalAlpha = 1; }
  return 0;
};
function rr(x, y, w, h, r) { r = Math.min(r, h / 2, w / 2); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
</script></body></html>
